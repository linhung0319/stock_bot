<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Bot 原型</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>stock bot 原型</h1>
  <span class="fake">價格、新聞、申報、AI 輸出全部是假的</span>
  <select id="scen" aria-label="情境"></select>
  <button id="reset" title="從頭開始這個情境">重來</button>
  <span class="clock" id="clock"></span>
  <span class="spacer"></span>
  <button id="step" title="前進半天：開盤前 ↔ 收盤後">下一步</button>
  <button id="day">下一天</button>
  <button id="nextNotif" class="primary">跳到下一則通知</button>
  <button id="nextMonth">跳到下個月報</button>
  <button id="theme" class="ghost" title="切換深淺色">◐</button>
</header>
<main>
  <section class="col" id="line">
    <div class="head">LINE 通知 <span class="dim">（你在手機上看到的）</span></div>
    <div class="scroll" id="lineScroll"></div>
    <div class="useract">
      <button data-act="deposit">入金</button>
      <button data-act="withdraw">出金</button>
      <button data-act="ratio">改比例</button>
      <button data-act="addOwn">新增自選</button>
      <button data-act="removeOwn">移除自選</button>
      <button data-act="manual">手動交易</button>
    </div>
  </section>
  <section class="col" id="center">
    <div class="head tabs" id="tabs">
      <button data-tab="log" class="sel">背後發生什麼</button>
      <button data-tab="web">網站</button>
      <button data-tab="table">觸發總表</button>
      <button data-tab="guide">情境說明</button>
      <button data-tab="notes">疑問筆記</button>
    </div>
    <div class="scroll" id="centerBody"></div>
  </section>
  <section class="col" id="right">
    <div class="head">帳戶 <span class="dim">（帳本＝每一股屬於哪一桶）</span></div>
    <div class="scroll" id="acct"></div>
  </section>
</main>
<div id="modal"><div class="box" id="modalBox"></div></div>
<script src="js/util.js"></script>
<script src="js/market.js"></script>
<script src="js/ai.js"></script>
<script src="js/engine.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
